name: ty ecosystem-analyzer

permissions:
  contents: read

# Third-party builds must not write caches consumed by other jobs.
# GitHub-hosted runners use GitHub's cache service, which enforces this mode.
cache-mode: read

on:
  pull_request:
    paths:
      - "crates/ty*/**"
      - "!crates/ty_ide/**"
      - "!crates/ty_server/**"
      - "!crates/ty_test/**"
      - "!crates/ty_completion_eval/**"
      - "!crates/ty_wasm/**"
      - "crates/ruff_db/**"
      - "crates/ruff_python_ast/**"
      - "crates/ruff_python_edits/**"
      - "crates/ruff_python_parser/**"
      - "crates/ruff_python_stdlib/**"
      - ".github/workflows/ty-ecosystem-analyzer.yaml"
      - ".github/actions/setup-ruff-workspace/action.yml"
      - ".github/ty-ecosystem.toml"
      - ".github/ty-ecosystem-constraints.txt"
      - "crates/ty_python_semantic/resources/primer/**"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "!**.md"
      - "!**.snap"
      # It's tempting to skip all Python files in every directory,
      # but changes to Python files in `ty_vendored` can affect the output of ecosystem analysis,
      # so we apply a narrow exemption for all files in the corpus directory instead.
      - "!crates/ty_python_semantic/resources/corpus/**"

concurrency:
  group: ty-ecosystem-analyzer-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  # Line-tables-only debug info: faster builds, backtraces still work.
  CARGO_PROFILE_PROFILING_DEBUG: line-tables-only

jobs:
  build-ty:
    name: Build ty (${{ matrix.revision }})
    strategy:
      matrix:
        revision: [base, pr]
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.repository == 'astral-sh/ruff' && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Faster to do this separately than to use `fetch-depth: 0` with `actions/checkout`
      - name: Fetch full history without tags
        if: matrix.revision == 'base'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --no-tags --filter=blob:none --unshallow origin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false
          save-if: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Build ty
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [[ "${REVISION}" == "base" ]]; then
            # The first parent contains any preceding layers in a stacked pull request.
            MERGE_BASE="$(git rev-parse "${GITHUB_SHA}^1")"
            echo "${MERGE_BASE}" > merge-base.txt
            echo "Merge base: ${MERGE_BASE}"
            echo "PR commit: ${GITHUB_SHA}"

            git checkout "${MERGE_BASE}"
          fi

          echo "Building ${REVISION} revision $(git rev-parse HEAD)"
          cargo build --package ty --profile profiling
          cp target/profiling/ty "ty-${REVISION}"

          if [[ "${REVISION}" == "pr" ]]; then
            cp crates/ty_python_semantic/resources/primer/flaky.txt projects_flaky.txt
            cp .github/ty-ecosystem.toml ty-ecosystem.toml
            cp .github/ty-ecosystem-constraints.txt ty-ecosystem-constraints.txt
          fi

      - name: Upload base ty binary
        if: matrix.revision == 'base'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ty-build-base
          compression-level: 1
          path: |
            ty-base
            merge-base.txt

      - name: Upload PR ty binary, flaky project list, config, and constraints
        if: matrix.revision == 'pr'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ty-build-pr
          compression-level: 1
          path: |
            ty-pr
            projects_flaky.txt
            ty-ecosystem.toml
            ty-ecosystem-constraints.txt

      - name: Upload ecosystem-analyzer dependency metadata
        if: matrix.revision == 'pr'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ty-build-dependencies
          path: |
            pyproject.toml
            uv.lock

  analyze-shards:
    needs: [build-ty]
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-32' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      EXCLUDE_NEWER: ${{ github.event.pull_request.updated_at }}
      # Enable experimental support for installing PEP 723 script dependencies.
      TY_UV: scripts
      TY_PRIMER_TEST_SOURCE: mypy-primer @ git+https://github.com/StableKite/mypy_primer.git@7ded71c3342160f219bdc888a71e56c66f17a0bb
    steps:
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          python-version: "3.13"
          # The lockfiles arrive with the artifacts, and only two small Git dependencies would be cached.
          enable-cache: false

      - name: Download ty binaries, flaky project list, config, constraints, and dependency metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ty-build-*
          merge-multiple: true

      - name: Audit the exact test-only schema installer repair
        if: github.repository != 'astral-sh/ruff'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run --locked --only-group=ty-ecosystem python - <<'PY'
          from dataclasses import asdict
          import hashlib
          import importlib.metadata as metadata
          import json
          from pathlib import Path
          import mypy_primer.projects as projects
          assert metadata.version("mypy-primer") == "0.1.0"
          assert hashlib.sha256(Path(projects.__file__).read_bytes()).hexdigest() == "ea402a2110f034b8d709b97e291b78fe4c042fd5ddf56a0089e7d3c49f76a899"
          direct = json.loads(metadata.distribution("mypy-primer").read_text("direct_url.json"))
          assert direct["vcs_info"]["commit_id"] == "e1f6fe93da5de0cbaf0ab00341d05968a0331fae"
          catalog = [asdict(project) for project in projects.get_projects()]
          assert len(catalog) == 163
          Path("primer-before.json").write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          PY
          uv run --locked --only-group=ty-ecosystem --with "$TY_PRIMER_TEST_SOURCE" python - <<'PY'
          from dataclasses import asdict
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path
          import mypy_primer.projects as projects
          assert metadata.version("mypy-primer") == "0.1.0+stablekite.1"
          assert hashlib.sha256(Path(projects.__file__).read_bytes()).hexdigest() == "703533620c646ffaf7bada3324143a707bf6265204abb8abe94981a7992c6b27"
          direct = json.loads(metadata.distribution("mypy-primer").read_text("direct_url.json"))
          assert direct["url"] == "https://github.com/StableKite/mypy_primer.git"
          assert direct["vcs_info"]["commit_id"] == "7ded71c3342160f219bdc888a71e56c66f17a0bb"
          before = json.loads(Path("primer-before.json").read_text(encoding="utf-8"))
          after = json.loads(json.dumps([asdict(project) for project in projects.get_projects()]))
          assert len(before) == len(after) == 163
          differences = []
          for old, new in zip(before, after, strict=True):
              changed = {key for key in old if old[key] != new[key]}
              if changed:
                  assert old["location"] == new["location"] == "https://github.com/common-workflow-language/schema_salad"
                  assert changed == {"install_cmd", "deps"}
                  assert new["install_cmd"] == "{install} '.[pycodegen]'"
                  assert new["deps"] == ["objgraph", "pytest", "setuptools", "types-dataclasses", "types-requests"]
                  differences.append({"old": old, "new": new})
          assert len(differences) == 1
          receipt = {"status": "PASS_GENUINE_INSTALL_ONLY_REPAIR_ALL_163_ANALYSIS_DESCRIPTORS_PRESERVED", "version": metadata.version("mypy-primer"), "direct_url": direct, "only_changes": differences, "same_dependency_for_old_and_new_analysis": True}
          Path("primer-installer-audit-" + os.environ["SHARD"] + ".json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(receipt["status"])
          PY

      - name: Analyze shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
          UV_CONSTRAINT: ${{ github.workspace }}/ty-ecosystem-constraints.txt
        run: |
          test_dependencies=()
          if [[ "$GITHUB_REPOSITORY" != "astral-sh/ruff" ]]; then
            test_dependencies=(--with "$TY_PRIMER_TEST_SOURCE")
          fi

          mkdir -p ~/.config/ty
          cp ty-ecosystem.toml ~/.config/ty/ty.toml

          chmod +x ty-base ty-pr
          MERGE_BASE="$(< merge-base.txt)"
          echo "MERGE_BASE: ${MERGE_BASE}"

          uv run \
            --locked \
            --only-group=ty-ecosystem \
            "${test_dependencies[@]}" \
            ecosystem-analyzer \
            --flaky-runs 10 \
            diff \
            --projects-flaky projects_flaky.txt \
            --ty-binary-old ty-base \
            --ty-binary-new ty-pr \
            --old "${MERGE_BASE}" \
            --new "${GITHUB_SHA}" \
            --exclude-newer "${EXCLUDE_NEWER}" \
            --shard "${SHARD}" \
            --num-shards 4 \
            --output-old "diagnostics-base-${SHARD}.json" \
            --output-new "diagnostics-PR-${SHARD}.json"

      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-shard-${{ matrix.shard }}
          path: |
            diagnostics-base-${{ matrix.shard }}.json
            diagnostics-PR-${{ matrix.shard }}.json
            primer-before.json
            primer-installer-audit-${{ matrix.shard }}.json

  generate-report:
    name: Generate diagnostic diff report
    needs: [analyze-shards]
    runs-on: ${{ github.repository == 'astral-sh/ruff' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: $/.github/actions/setup-ruff-workspace
        with:
          python-version: "3.13"
          group: jaq
          # The lockfiles arrive with the artifacts, and only two small Git dependencies would be cached.
          enable-cache: false

      - name: Download ecosystem-analyzer dependency metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ty-build-dependencies

      - name: Download shard diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: diagnostics-shard-*
          merge-multiple: true

      - name: Generate reports
        id: generate-reports
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref }}
        run: |
          # jaq slurps each input file separately, so feed all shards through stdin.
          cat diagnostics-base-*.json | jaq -s '{ outputs: [.[].outputs[]] }' > diagnostics-base.json
          cat diagnostics-PR-*.json   | jaq -s '{ outputs: [.[].outputs[]] }' > diagnostics-PR.json

          mkdir dist

          # Upload a structured JSON report alongside the HTML report to make
          # ecosystem changes easier for agents to analyze.
          uv run \
            --locked \
            --only-group=ty-ecosystem \
            ecosystem-analyzer \
            generate-diff \
            diagnostics-base.json \
            diagnostics-PR.json \
            --old-name "${BASE_REF_NAME} (merge base)" \
            --new-name "$REF_NAME" \
            --output-html dist/diff.html \
            --output-json dist/diff.json

          set +e
          uv run \
            --locked \
            --only-group=ty-ecosystem \
            ecosystem-analyzer \
            generate-diff-statistics \
            diagnostics-base.json \
            diagnostics-PR.json \
            --fail-on-new-abnormal-exits \
            --old-name "${BASE_REF_NAME} (merge base)" \
            --new-name "$REF_NAME" \
            --output diff-statistics.md
          DIFF_STATISTICS_EXIT_CODE=$?
          set -e

          uv run \
            --locked \
            --only-group=ty-ecosystem \
            ecosystem-analyzer \
            generate-timing-diff \
            diagnostics-base.json \
            diagnostics-PR.json \
            --old-name "${BASE_REF_NAME} (merge base)" \
            --new-name "$REF_NAME" \
            --output-html dist/timing.html

          cat diff-statistics.md >> comment.md

          cat diff-statistics.md >> "$GITHUB_STEP_SUMMARY"

          echo "diff_statistics_exit_code=$DIFF_STATISTICS_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: "Upload full report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-report
          path: dist/

      - name: Upload comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comment.md
          path: comment.md

      - name: Fail on new abnormal exits
        if: steps.generate-reports.outputs.diff_statistics_exit_code != '0'
        run: exit 1

  publish-report:
    needs: generate-report
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.repository == 'astral-sh/ruff' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.generate-report.result == 'success' || needs.generate-report.result == 'failure')
    uses: astral-sh/ruff/.github/workflows/publish-pull-request-report.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      KV_API_URL: ${{ secrets.KV_API_URL }}
      STS_API_URL: ${{ secrets.STS_API_URL }}
    permissions:
      contents: read
      id-token: write
    with:
      report: ty-ecosystem
      artifact: comment.md
      filename: comment.md
      full-report-artifact: full-report
      upload-html: true
      html-files: |
        {
          "diff.html": {"content-type": "text/html; charset=utf-8", "label": "Full report with detailed diff"},
          "timing.html": {"content-type": "text/html; charset=utf-8", "label": "Timing results"},
          "diff.json": {"content-type": "application/json"}
        }
